# Dev app — deploys from the dev branch to sp-daily-memo-mtm6-w
# Deploy with: fly deploy --config fly.dev.toml

app = 'sp-daily-memo-mtm6-w'
primary_region = 'iad'

[build]

[env]
  DB_PATH = "/data/camp_manager.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "camp_data_dev"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
